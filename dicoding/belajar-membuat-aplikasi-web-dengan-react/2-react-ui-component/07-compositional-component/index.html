<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Product Search Table</title>
</head>
<body>

    <!-- Kotak Pencarian -->
    <form>
        <input type="text" placeholder="search product">
        <br>
        <!-- Pilihan Filter -->
        <label>
            <input type="checkbox"> Only show products in stock
        </label>
    </form>

    <br>

    <!-- Tabel Data Produk -->
    <table border="0" cellpadding="3" cellspacing="0">
        <thead>
            <tr>
                <th align="left">Name</th>
                <th align="left">&nbsp;&nbsp;&nbsp;&nbsp;Price</th>
            </tr>
        </thead>
        <tbody>
            <!-- Kategori: Sporting Goods -->
            <tr>
                <td colspan="2"><b>Sporting Goods</b></td>
            </tr>
            <tr>
                <td>Football</td>
                <td>&nbsp;&nbsp;&nbsp;&nbsp;$49.99</td>
            </tr>
            <tr>
                <td>Baseball</td>
                <td>&nbsp;&nbsp;&nbsp;&nbsp;$9.99</td>
            </tr>
            <tr>
                <td>Football</td>
                <td>&nbsp;&nbsp;&nbsp;&nbsp;$49.99</td>
            </tr>

            <!-- Kategori: Electronics -->
            <tr>
                <td colspan="2"><b>Electronics</b></td>
            </tr>
            <tr>
                <td>iPod Touch</td>
                <td>&nbsp;&nbsp;&nbsp;&nbsp;$99.99</td>
            </tr>
            <tr>
                <td>iPhone 5</td>
                <td>&nbsp;&nbsp;&nbsp;&nbsp;$399.99</td>
            </tr>
            <tr>
                <td>Nexus 7</td>
                <td>&nbsp;&nbsp;&nbsp;&nbsp;$199.99</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
